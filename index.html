<style>
  :root {
    --accent:#4B3BE6; --ink:#17181D; --muted:#6B6A76;
    padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Noto Sans KR",system-ui,sans-serif;color:#fff;
    background:linear-gradient(140deg,#FC5262 0%,#C33196 45%,#802AAA 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;}
  .card{width:100%;max-width:460px;text-align:center;}
  .icon{width:132px;height:132px;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.28);margin-bottom:22px;}
  h1{font-size:34px;font-weight:900;letter-spacing:-.02em;}
  .sub{font-size:17px;color:rgba(255,255,255,.9);margin-top:6px;font-weight:500;}
  ul{list-style:none;margin:26px 0;display:inline-block;text-align:left;}
  li{font-size:16px;margin:12px 0;display:flex;align-items:center;gap:11px;}
  li .dot{width:9px;height:9px;border-radius:50%;background:#fff;flex:0 0 auto;}
  .patent{display:inline-block;background:rgba(255,255,255,.92);color:var(--accent);
    font-size:13.5px;font-weight:700;padding:7px 18px;border-radius:999px;margin-bottom:8px;}
  .btn{display:block;background:#17181D;color:#fff;text-decoration:none;font-weight:700;
    font-size:18px;padding:17px;border-radius:16px;margin:26px 0 20px;transition:transform .12s;}
  .btn:active{transform:scale(.98);}
  .qr{width:180px;height:180px;background:#fff;border-radius:18px;padding:12px;margin:8px auto 0;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .qr img{width:100%;height:100%;display:block;}
  .qr-cap{font-size:13px;color:rgba(255,255,255,.85);margin-top:12px;}
  footer{margin-top:30px;font-size:12px;color:rgba(255,255,255,.65);}
</style>
